syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package HostBuffers;

message HostMessage {
  repeated Instruction instruction = 1;
}

message Instruction {
  extensions 2 to max;
}

message HostBytes {
  optional bytes hoststring = 4;
}

message ResizeMessage {
  optional int32 width = 5;
  optional int32 height = 6;
}

message EchoAck {
  optional uint64 echo_ack_num = 8;
}

// Scrollback history synchronization.  Counters are totals as of the
// sender's state; lines carry the logical lines the receiver is
// missing (oldest first), pre-rendered as self-contained ANSI strings.
// Stock receivers ignore this instruction.
message HistoryLines {
  optional uint64 line_count = 1;   // logical lines ever finalized
  optional uint64 row_count = 2;    // display rows ever scrolled off
  optional uint64 clear_count = 3;  // scrollback-clear generation (CSI 3 J)
  optional uint64 first_seq = 4;    // seq of lines[0]
  repeated bytes lines = 5;
}

extend Instruction {
  optional HostBytes hostbytes = 2;
  optional ResizeMessage resize = 3;
  optional EchoAck echoack = 7;
  optional HistoryLines history = 8;
}
